apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: roboshop
  labels:
    name: roboshop
    env: dev
    running: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      name: roboshop
      env: dev
      running: redis
  template:
    metadata:
      labels:
        name: roboshop
        env: dev
        running: redis
    spec:
      containers:
      - name: redis
        image: redis:7.0
        imagePullPolicy: Always
        ports:
        - name: liveness-port 
          containerPort: 6379
        readinessProbe:
          tcpSocket:
            port: 6379
          failureThreshold: 1
          periodSeconds: 20
        livenessProbe:
          tcpSocket:
            port: 6379
          failureThreshold: 1
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: roboshop
spec:
  type: ClusterIP
  selector:
      name: roboshop
      env: dev
      running: redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
  

