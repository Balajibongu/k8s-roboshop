apiVersion: v1
kind: Deployment
metadata:
  name: redis
  namespace: roboshop
  labels:
    name: roboshop
    env: dev
    running: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      name: roboshop
      env: dev
      running: redis
  template:
    metadata:
      labels:
        name: roboshop
        env: dev
        running: redis
  spec:
    containers:
    - name: redis
      image: redis:7.0
      imagePullPolicy: Always
      ports:
      - name: liveness-port 
        containerPort: 6379
      readinessProbe:
        httpGet:
          path: /health
          port: liveness-probe
        failureThreshold: 1
        periodSeconds: 20
      livenessProbe:
        httpGet:
          path: /health
          port: liveness-port
        failureThreshold: 1
        periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
spec:
  type: ClusterIp
  selector:
    matchLabels:
      name: roboshop
      env: dev
      running: redis
  ports:
    - protocal: TCP
      port: 6379
      targetport: 6379
  

