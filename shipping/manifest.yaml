apiVersion: v1
kind: ConfigMap
metadata:
  name: shipping-configmap
  namespace: roboshop
data:
  CART_ENDPOINT: cart:8080
  DB_HOST: mysql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping
  namespace: roboshop
  labels:
    name: roboshop
    env: dev
    running: shipping
spec: 
  replicas: 1
  selector:
    matchLabels:
      name: roboshop
      env: dev
      running: shipping
  template:
    metadata:
      labels:
        name: roboshop
        env: dev
        running: shipping
    spec:
      containers:
      - name: shipping
        image: balaji1729/shipping:v1
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: shipping-configmap 
        ports:
        - name: liveness-port 
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health
            port: liveness-port
          failureThreshold: 1
          periodSeconds: 20
        livenessProbe:
          httpGet:
            path: /health
            port: liveness-port
          failureThreshold: 1
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: shipping
  namespace: roboshop
spec:
  type: ClusterIP
  selector:
      name: roboshop
      env: dev
      running: shipping
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080