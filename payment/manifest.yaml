apiVersion: v1
kind: configMap
metadata:
  name: payment-configmap
data:
  CART_HOST: "cart"
  CART_PORT: "8080"
  USER_HOST: "user"
  USER_PORT: "8080"
  AMQP_HOST: "rabbitmq"
  AMQP_USER: "roboshop"
  AMQP_PASS: "roboshop123"
---
apiVersion: app/v1
kind: Deployment
metadata:
  name: payment
  namespace: roboshop
  labels:
    name: roboshop
    env: dev
    running: payment
spec: 
  replicas: 1
  selector:
    matchLabels:
      name: roboshop
      env: dev
      running: payment
  template:
    metadata:
      labels:
        name: roboshop
        env: dev
        running: payment
  spec:
    containers:
    - name: payment
      image: balaji1729/payment:v1
      imagePullPolicy: Always
      ports:
      - name: liveness-port
        containerPort: 8080
      envForm:
      - configMapRef:
          name: payment-configmap 
      readinessProbe:
        httpGet:
          path: /health
          port: liveness-probe
        failureThreshold: 1
        periodSeconds: 20
      livenessProbe:
        httpGet:
          path: /health
          port: liveness-port
        failureThreshold: 1
        periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
spec:
  type: ClusterIp
  selector:
    matchLabels:
      name: roboshop
      env: dev
      running: payment
  ports:
    - protocal: TCP
      port: 8080
      targetport: 8080