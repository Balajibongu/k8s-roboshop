apiVersion: v1
kind: configMap
metadata:
  name: catalogue-configmap
data:
  MONGO: "true"
  MONGO_URL: "mongodb://mongodb:27017/catalogue"
---
apiVersion: v1
kind: Deployment
metadata:
  name: catalogue
  namespace: roboshop
  labels:
    name: roboshop
    env: dev
    running: catalogue
spec: 
  replicas: 1
  selector:
    matchLabels:
      name: roboshop
      env: dev
      running: catalogue
  template:
    metadata:
      labels:
        name: roboshop
        env: dev
        running: catalogue
  spec:
    containers:
    - name: catalogue
      image: balaji1729/catalogue:v1
      imagePullPolicy: Always
      ports:
      - containerPort: 8080
      envForm:
      - configMapRef:
          name: catalogue-configmap 
---
apiVersion: v1
kind: Service
metadata:
  name: catalogue-service
spec:
  type: ClusterIp
  selector:
    matchLabels:
      name: roboshop
      env: dev
      running: catalogue
  ports:
    - protocal: TCP
      port: 8080
      targetport: 8080