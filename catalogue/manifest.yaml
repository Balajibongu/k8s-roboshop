apiVersion: v1
kind: ConfigMap
metadata:
  name: catalogue-configmap
  namespace: roboshop
data:
  MONGO: "true"
  MONGO_URL: "mongodb://mongodb:27017/catalogue"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue
  namespace: roboshop
  labels:
    name: roboshop
    env: dev
    running: catalogue
spec: 
  replicas: 1
  selector:
    matchLabels:
      name: roboshop
      env: dev
      running: catalogue
  template:
    metadata:
      labels:
        name: roboshop
        env: dev
        running: catalogue
  spec:
    containers:
    - name: catalogue
      image: balaji1729/catalogue:v1
      imagePullPolicy: Always
      ports:
      - name: liveness-port
        containerPort: 8080
      envFrom:
      - configMapRef:
          name: catalogue-configmap 
      readinessProbe:
        httpGet:
          path: /health
          port: liveness-port
        failureThreshold: 1
        periodSeconds: 20
      livenessProbe:
        httpGet:
          path: /health
          port: liveness-port
        failureThreshold: 1
        periodSeconds: 30 
---
apiVersion: v1
kind: Service
metadata:
  name: catalogue-service
  namespace: roboshop
spec:
  type: ClusterIP
  selector:
      name: roboshop
      env: dev
      running: catalogue
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080