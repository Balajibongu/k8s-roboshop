apiVersion: v1
kind: Deployment
metadata:
  name: mongodb
  namespace: roboshop
  labels:
    name: roboshop
    env: dev
    running: mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      name: roboshop
      env: dev
      running: mongodb
  template:
    metadata:
      labels:
        name: roboshop
        env: dev
        running: mongodb
  spec:
    containers:
    - name: mongodb
      image: balaji1729/mongodb:v1
      imagePullPolicy: Always
      ports:
      - containerPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
spec:
  type: ClusterIp
  selector:
    matchLabels:
      name: roboshop
      env: dev
      running: mongodb
  ports:
    - protocal: TCP
      port: 27017
      targetport: 27017
  

