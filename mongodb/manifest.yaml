apiVersion: apps/v1
kind: Deployment

metadata:
  name: mongodb
  namespace: roboshop
  labels:
    name: roboshop
    env: dev
    running: mongodb

spec:
  replicas: 1

  selector:
    matchLabels:
      name: roboshop
      env: dev
      running: mongodb

  template:
    metadata:
      labels:
        name: roboshop
        env: dev
        running: mongodb

    spec:
      containers:
        - name: mongodb
          image: balaji1729/mongodb:v1
          imagePullPolicy: Always

          ports:
            - name: mongodb
              containerPort: 27017

          readinessProbe:
            tcpSocket:
              port: mongodb
            failureThreshold: 1
            periodSeconds: 20

          livenessProbe:
            tcpSocket:
              port: mongodb
            failureThreshold: 1
            periodSeconds: 30

---

apiVersion: v1
kind: Service

metadata:
  name: mongodb-service
  namespace: roboshop

spec:
  type: ClusterIP

  selector:
    name: roboshop
    env: dev
    running: mongodb

  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017