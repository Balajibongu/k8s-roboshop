apiVersion: v1
kind: configMap
metadata:
  name: rabbitmq-configmap
  namespace: roboshop
data:
  RABBITMQ_DEFAULT_USER: "rabbitmq"
  RABBITMQ_DEFAULT_PASS: "rabbitmq123"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: roboshop
  labels:
    name: roboshop
    env: dev
    running: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      name: roboshop
      env: dev
      running: rabbitmq
  template:
    metadata:
      labels:
        name: roboshop
        env: dev
        running: rabbitmq
  spec:
    containers:
    - name: rabbitmq
      image: rabbitmq:3
      imagePullPolicy: Always
      ports:
      - name: liveness-port 
        containerPort: 5672
      readinessProbe:
        httpGet:
          path: /health
          port: liveness-probe
        failureThreshold: 1
        periodSeconds: 20
      livenessProbe:
        httpGet:
          path: /health
          port: liveness-port
        failureThreshold: 1
        periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-service
  namespace: roboshop
spec:
  type: ClusterIP
  selector:
      name: roboshop
      env: dev
      running: rabbitmq
  ports:
      - protocol: TCP
        port: 5672
        targetPort: 5672
