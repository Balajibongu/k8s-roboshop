apiVersion: v1
kind: configMap
metadata:
  name: user-configmap
data:
  MONGO: "true"
  REDIS_URL: "redis://redis:6379"
  MONGO_URL: "mongodb://mongodb:27017/users"
---
apiVersion: v1
kind: Deployment
metadata:
  name: user
  namespace: roboshop
  labels:
    name: roboshop
    env: dev
    running: user
spec: 
  replicas: 1
  selector:
    matchLabels:
      name: roboshop
      env: dev
      running: user
  template:
    metadata:
      labels:
        name: roboshop
        env: dev
        running: user
  spec:
    containers:
    - name: user
      image: balaji1729/user
      imagePullPolicy: Always
      ports:
      - containerPort: 8080
      envForm:
      - configMapRef:
          name: user-configmap 
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
spec:
  type: ClusterIp
  selector:
    matchLabels:
      name: roboshop
      env: dev
      running: user
  ports:
    - protocal: TCP
      port: 8080
      targetport: 8080