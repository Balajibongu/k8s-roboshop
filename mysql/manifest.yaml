apiVersion: app/v1
kind: Deployment
metadata:
  name: mysql
  namespace: roboshop
  labels:
    name: roboshop
    env: dev
    running: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      name: roboshop
      env: dev
      running: mysql
  template:
    metadata:
      labels:
        name: roboshop
        env: dev
        running: mysql
  spec:
    containers:
    - name: mysql
      image: balaji1729/mysql:v1
      imagePullPolicy: Always
      ports:
      - name: liveness-port 
        containerPort: 3306
      readinessProbe:
        httpGet:
          path: /health
          port: liveness-probe
        failureThreshold: 1
        periodSeconds: 20
      livenessProbe:
        httpGet:
          path: /health
          port: liveness-port
        failureThreshold: 1
        periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: roboshop
spec:
  type: ClusterIP
  selector:
      name: roboshop
      env: dev
      running: mysql
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306
  

