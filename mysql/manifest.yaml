apiVersion: v1
kind: Deployment
metadata:
  name: mysql
  namespace: roboshop
  labels:
    name: roboshop
    env: dev
    running: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      name: roboshop
      env: dev
      running: mysql
  template:
    metadata:
      labels:
        name: roboshop
        env: dev
        running: mysql
  spec:
    containers:
    - name: mysql
      image: balaji1729/mysql:v1
      imagePullPolicy: Always
      ports:
      - containerPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
spec:
  type: ClusterIp
  selector:
    matchLabels:
      name: roboshop
      env: dev
      running: mysql
  ports:
    - protocal: TCP
      port: 3306
      targetport: 3306
  

